name: Build Alpine rootfs

on:
  workflow_dispatch:
    inputs:
      ssh_auth:
        description: SSH authentication mode (open-root-usb = direct root login on USB only)
        required: true
        type: choice
        default: generated-key
        options:
          - generated-key
          - public-key-input
          - public-key-secret
          - generated-password
          - password-secret
          - generated-key+generated-password
          - public-key-input+password-secret
          - public-key-secret+password-secret
          - open-root-usb
      ssh_public_key:
        description: Public key to install when using a public-key-input mode
        required: false
        type: string
      kernel_run_id:
        description: Optional Build mainline kernel run ID; empty uses the latest successful run
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: channel-alpine-rootfs
  cancel-in-progress: true

env:
  DISTRO: alpine
  ARCH: arm64
  ROOTFS_LABEL: alpine
  ROOTFS_UUID: 89530000-6320-4000-8000-000000000001

jobs:
  rootfs:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout Alpine builder branch
        uses: actions/checkout@v4
        with:
          ref: alpine

      - name: Validate Alpine scripts
        run: |
          set -eux
          bash -n alpine/build.sh
          sh -n alpine/rootfs/usr/local/sbin/channel-usb-gadget
          sh -n alpine/rootfs/usr/local/sbin/channel-wifi-firmware
          sh -n alpine/rootfs/etc/init.d/channel-usb-gadget
          sh -n alpine/rootfs/etc/init.d/channel-sshd
          sh -n alpine/rootfs/etc/init.d/channel-wifi-firmware

      - name: Install Alpine rootfs dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates curl rsync cpio gzip xz-utils zstd \
            e2fsprogs qemu-user-static binfmt-support \
            openssh-client openssl kmod file device-tree-compiler
          sudo update-binfmts --enable qemu-aarch64
          /usr/bin/qemu-aarch64-static --version
          command -v gh

      - name: Resolve reusable kernel run
        id: kernel_run
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_RUN_ID: ${{ inputs.kernel_run_id }}
        run: |
          set -euxo pipefail
          if [ -n "$REQUESTED_RUN_ID" ]; then
            RUN_ID="$REQUESTED_RUN_ID"
          else
            RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build-mainline.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Build mainline kernel run found. Run build-mainline.yml first." >&2
            exit 1
          fi
          gh run view "$RUN_ID" --repo "$GITHUB_REPOSITORY" --json conclusion --jq '.conclusion' | grep -qx success
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download reusable kernel checkpoint
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ steps.kernel_run.outputs.run_id }}
          github-token: ${{ github.token }}
          pattern: channel-mainline-kernel-*
          path: kernel-artifact
          merge-multiple: true

      - name: Validate reusable kernel checkpoint
        run: |
          set -euxo pipefail
          KERNEL_DIR="$GITHUB_WORKSPACE/kernel-artifact"
          test -s "$KERNEL_DIR/kernel-release.txt"
          test -s "$KERNEL_DIR/kernel.config"
          test -s "$KERNEL_DIR/System.map"
          test -s "$KERNEL_DIR/sdm632-motorola-channel.dtb"
          MODULES_ARCHIVE="$(find "$KERNEL_DIR" -maxdepth 1 -type f -name 'kernel-modules-*.tar.zst' -print -quit)"
          test -n "$MODULES_ARCHIVE"
          test -s "$MODULES_ARCHIVE"
          KREL="$(cat "$KERNEL_DIR/kernel-release.txt")"
          test -n "$KREL"
          case "$KREL" in *-dirty) echo "dirty kernel checkpoint: $KREL" >&2; exit 1;; esac
          test "$(fdtget -t s "$KERNEL_DIR/sdm632-motorola-channel.dtb" /soc@0/remoteproc@a204000/iris compatible)" = "qcom,wcn3620"
          grep -qx 'CONFIG_WCN36XX=m' "$KERNEL_DIR/kernel.config"
          grep -qx 'CONFIG_QCOM_WCNSS_PIL=m' "$KERNEL_DIR/kernel.config"
          grep -qx 'CONFIG_QCOM_WCNSS_CTRL=m' "$KERNEL_DIR/kernel.config"
          grep -qx 'CONFIG_USB_CONFIGFS_RNDIS=y' "$KERNEL_DIR/kernel.config"
          grep -qx 'CONFIG_USB_DWC3_QCOM=y' "$KERNEL_DIR/kernel.config"
          echo "KERNEL_RELEASE=$KREL" >> "$GITHUB_ENV"
          echo "KERNEL_MODULES_ARCHIVE=$MODULES_ARCHIVE" >> "$GITHUB_ENV"
          echo "KERNEL_CONFIG_FILE=$KERNEL_DIR/kernel.config" >> "$GITHUB_ENV"
          echo "KERNEL_SYSTEM_MAP_FILE=$KERNEL_DIR/System.map" >> "$GITHUB_ENV"

      - name: Build Alpine rootfs
        env:
          DISTRO: ${{ env.DISTRO }}
          ROOTFS_LABEL: ${{ env.ROOTFS_LABEL }}
          ROOTFS_UUID: ${{ env.ROOTFS_UUID }}
          KERNEL_RELEASE: ${{ env.KERNEL_RELEASE }}
          KERNEL_MODULES_ARCHIVE: ${{ env.KERNEL_MODULES_ARCHIVE }}
          KERNEL_CONFIG_FILE: ${{ env.KERNEL_CONFIG_FILE }}
          KERNEL_SYSTEM_MAP_FILE: ${{ env.KERNEL_SYSTEM_MAP_FILE }}
          OUT_DIR: ${{ github.workspace }}/out
          WORK_DIR: ${{ github.workspace }}/.work
          SSH_AUTH_MODE: ${{ inputs.ssh_auth }}
          SSH_PUBLIC_KEY_INPUT: ${{ inputs.ssh_public_key }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          set -euxo pipefail
          chmod +x alpine/build.sh
          alpine/build.sh
          test -s out/alpine-channel-rootfs.ext4.zst
          grep -Fqx 'distribution=alpine' out/build-info.txt
          grep -Fqx 'rootfs_label=alpine' out/build-info.txt
          grep -Fqx "rootfs_uuid=$ROOTFS_UUID" out/build-info.txt
          grep -Fqx 'init=openrc' out/build-info.txt
          grep -Fqx 'wifi_manager=NetworkManager' out/build-info.txt
          grep -Fqx 'time_sync=chrony' out/build-info.txt
          grep -Fqx 'ssh_listen=172.16.42.1' out/build-info.txt

      - name: Upload Alpine rootfs
        uses: actions/upload-artifact@v4
        with:
          name: channel-alpine-rootfs
          path: |
            out/alpine-channel-rootfs.ext4.zst
            out/build-info.txt
            out/SHA256SUMS.alpine
          if-no-files-found: error
          retention-days: 14

      - name: Upload generated SSH test key
        if: always() && hashFiles('out/channel_test_ed25519') != ''
        uses: actions/upload-artifact@v4
        with:
          name: channel-alpine-ssh-test-key
          path: |
            out/channel_test_ed25519
            out/channel_test_ed25519.pub
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload generated SSH password
        if: always() && hashFiles('out/channel_ssh_password.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: channel-alpine-ssh-password
          path: out/channel_ssh_password.txt
          if-no-files-found: ignore
          retention-days: 1
